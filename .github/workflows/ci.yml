name: ci

on:
  push:
    branches:
      - main
      - v2
      - v1
  pull_request:
    branches:
      - main
      - v2
      - v1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare For Dev
        run: pnpm run dev:prepare

      - name: Type check
        run: pnpm run test:types

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare For Dev
        run: pnpm run dev:prepare

      - name: Test
        run: pnpm run test

  pack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare For Dev
        run: pnpm run dev:prepare

      - name: Build an app against the packed module
        run: bash scripts/pack-smoke.sh

  compat-5:
    runs-on: ubuntu-latest
    # Whether the module runs on Nuxt 5 (Nitro v3) is still being checked, so this job reports without blocking.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Prepare For Dev
        run: pnpm run dev:prepare

      - name: Test the v2 fixtures with compatibilityVersion 5
        env:
          NUXT_TEST_COMPAT: "5"
        run: pnpm exec vitest run --project e2e
